<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title data-i18n="appTitle">BiliPace-B站倍速管家 · 设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <img src="icon128.png" class="logo" data-i18n-alt="logoAlt" alt="扩展图标" width="40" height="40">
    <div class="title-wrap">
      <h1 data-i18n="extName">BiliPace-B站倍速管家</h1>
      <p class="sub" data-i18n="appSub">无极调速 · 标题匹配 · 一键切换</p>
    </div>
  </header>

  <main>
    <!-- 调节范围 -->
    <section class="panel" data-panel="range">
      <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
        <span class="panel-title" data-i18n="panelRange">调节范围</span>
        <span class="chevron" aria-hidden="true"></span>
      </div>
      <div class="panel-body">
        <div class="field-grid">
          <div class="field">
            <span class="field-label" data-i18n="minSpeed">最小速度</span>
            <div class="stepper">
              <button type="button" class="stepper-btn dec" data-i18n-aria="decrease" aria-label="减少">−</button>
              <input type="number" id="min" step="0.05" min="0.05" placeholder="0.1">
              <button type="button" class="stepper-btn inc" data-i18n-aria="increase" aria-label="增加">+</button>
            </div>
          </div>
          <div class="field">
            <span class="field-label" data-i18n="maxSpeed">最大速度</span>
            <div class="stepper">
              <button type="button" class="stepper-btn dec" data-i18n-aria="decrease" aria-label="减少">−</button>
              <input type="number" id="max" step="0.05" min="0.05" placeholder="4.0">
              <button type="button" class="stepper-btn inc" data-i18n-aria="increase" aria-label="增加">+</button>
            </div>
          </div>
          <div class="field">
            <span class="field-label" data-i18n="sliderStep">滑块步进</span>
            <div class="stepper">
              <button type="button" class="stepper-btn dec" data-i18n-aria="decrease" aria-label="减少">−</button>
              <input type="number" id="step" step="0.005" min="0.001" placeholder="0.01">
              <button type="button" class="stepper-btn inc" data-i18n-aria="increase" aria-label="增加">+</button>
            </div>
          </div>
          <div class="field">
            <span class="field-label" data-i18n="fineStep">微调步长</span>
            <div class="stepper">
              <button type="button" class="stepper-btn dec" data-i18n-aria="decrease" aria-label="减少">−</button>
              <input type="number" id="fineStep" step="0.01" min="0.01" placeholder="0.05">
              <button type="button" class="stepper-btn inc" data-i18n-aria="increase" aria-label="增加">+</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 常用倍速 -->
    <section class="panel" data-panel="presets">
      <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
        <span class="panel-title" data-i18n="panelPresets">常用倍速</span>
        <span class="chevron" aria-hidden="true"></span>
      </div>
      <div class="panel-body">
        <div id="presets" class="preset-list"></div>
        <button type="button" id="addPreset" class="add-btn">
          <span class="icon">+</span> <span data-i18n="addPreset">添加常用倍速</span>
        </button>
      </div>
    </section>

    <!-- 标题倍速匹配 -->
    <section class="panel" data-panel="titleMatch">
      <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
        <span class="panel-title" data-i18n="panelTitleMatch">标题倍速匹配</span>
        <label class="switch" data-i18n-title="enableTitleMatch" title="启用标题匹配">
          <input type="checkbox" id="titleMatchEnabled">
          <span class="slider"></span>
        </label>
        <span class="chevron" aria-hidden="true"></span>
      </div>
      <div class="panel-body">
        <p class="hint" data-i18n="titleMatchHint">视频标题含关键词时自动套用对应倍速；拖拽左侧把手调整优先级，越靠上优先级越高</p>
        <div id="titleRules" class="rule-list"></div>
        <div class="rule-actions">
          <button type="button" id="addTitleRule" class="add-btn ghost">
            <span class="icon">+</span> <span data-i18n="addRule">关键词规则</span>
          </button>
          <button type="button" id="autoAddTitle" class="add-btn primary-soft" data-i18n="autoAdd">
            自动添加当前视频
          </button>
        </div>
      </div>
    </section>

    <section class="actions">
      <button type="button" id="save" class="btn primary" data-i18n="save">保存设置</button>
      <button type="button" id="reset" class="btn secondary" data-i18n="reset">恢复默认</button>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
